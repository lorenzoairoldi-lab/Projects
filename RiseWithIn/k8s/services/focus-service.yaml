# Service: focus-service
#
# Service ClusterIP per focus-service.
# Espone il workload soltanto all'interno del cluster e seleziona i Pod tramite label.
apiVersion: v1
kind: Service
metadata:
  name: focus-service
  namespace: risewithin
  labels:
    app.kubernetes.io/name: focus-service
spec:
  selector:
    app.kubernetes.io/name: focus-service
  ports:
    - name: http
      port: 4006
      targetPort: http
  type: ClusterIP
