# ConfigMap: prometheus-config
#
# ConfigMap prometheus-config.
# Contiene configurazione non sensibile consumata dai workload della piattaforma.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: risewithin
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: risewithin-services
        metrics_path: /metrics
        static_configs:
          - targets: [api-gateway:4000, auth-service:4001, user-service:4002, habits-service:4003, goals-service:4004, routine-service:4005, focus-service:4006, content-service:4007, community-service:4008, subscription-service:4009, notification-service:4010]
