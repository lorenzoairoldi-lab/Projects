# Secret: platform-secrets
#
# Esempio del Secret platform-secrets.
# Non applicare questi placeholder in produzione: sostituirli con valori Base64 sicuri
# oppure utilizzare un gestore esterno dei secret.
apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
  namespace: risewithin
  labels:
    app.kubernetes.io/part-of: risewithin
type: Opaque
stringData:
  JWT_ACCESS_SECRET: replace-before-apply
  JWT_REFRESH_SECRET: replace-before-apply
  AUTH_DATABASE_URL: 'postgres://user:password@host:5432/auth'
  USER_DATABASE_URL: 'postgres://user:password@host:5432/users'
  HABITS_DATABASE_URL: 'postgres://user:password@host:5432/habits'
  GOALS_DATABASE_URL: 'postgres://user:password@host:5432/goals'
  ROUTINE_DATABASE_URL: 'postgres://user:password@host:5432/routines'
  FOCUS_DATABASE_URL: 'postgres://user:password@host:5432/focus'
  SUBSCRIPTION_DATABASE_URL: 'postgres://user:password@host:5432/subscriptions'
  CONTENT_MONGO_URL: 'mongodb://user:password@host:27017/content'
  COMMUNITY_MONGO_URL: 'mongodb://user:password@host:27017/community'
  NOTIFICATION_MONGO_URL: 'mongodb://user:password@host:27017/notifications'
  STRIPE_SECRET_KEY: sk_live_replace
  STRIPE_WEBHOOK_SECRET: whsec_replace
  STRIPE_PRO_PRICE_ID: price_replace
  STRIPE_PREMIUM_PRICE_ID: price_replace
