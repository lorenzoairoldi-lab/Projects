# Deployment: api-gateway
#
# Deployment Kubernetes per api-gateway.
# Definisce repliche, immagine, configurazione, probe, risorse e sicurezza del Pod.
# Il tag immagine statico è un valore di bootstrap: la pipeline CI/CD lo sostituisce
# con l'immagine GHCR associata allo SHA del commit prima di verificare il rollout.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: risewithin
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: risewithin
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/part-of: risewithin
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api-gateway
          image: 'ghcr.io/your-org/risewithin/api-gateway:1.0.0'
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - configMapRef:
                name: platform-config
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
