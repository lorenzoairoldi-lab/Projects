# Deployment: frontend
#
# Deployment Kubernetes per frontend.
# Definisce repliche, immagine, configurazione, probe, risorse e sicurezza del Pod.
# Il tag immagine statico è un valore di bootstrap: la pipeline CI/CD lo sostituisce
# con l'immagine GHCR associata allo SHA del commit prima di verificare il rollout.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: risewithin
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: risewithin
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: risewithin
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: 'ghcr.io/your-org/risewithin/frontend:1.0.0'
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
