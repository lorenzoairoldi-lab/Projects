# Deployment: prometheus
#
# Deployment Kubernetes per prometheus.
# Definisce repliche, immagine, configurazione, probe, risorse e sicurezza del Pod.
# Il tag immagine statico è un valore di bootstrap: la pipeline CI/CD lo sostituisce
# con l'immagine GHCR associata allo SHA del commit prima di verificare il rollout.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: risewithin
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: 'prom/prometheus:v3.5.0'
          args:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.retention.time=7d'
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          configMap:
            name: prometheus-config
