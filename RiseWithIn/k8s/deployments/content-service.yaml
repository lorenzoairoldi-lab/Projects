# Deployment: content-service
#
# Deployment Kubernetes per content-service.
# Definisce repliche, immagine, configurazione, probe, risorse e sicurezza del Pod.
# Il tag immagine statico è un valore di bootstrap: la pipeline CI/CD lo sostituisce
# con l'immagine GHCR associata allo SHA del commit prima di verificare il rollout.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: content-service
  namespace: risewithin
  labels:
    app.kubernetes.io/name: content-service
    app.kubernetes.io/part-of: risewithin
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: content-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: content-service
        app.kubernetes.io/part-of: risewithin
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: content-service
          image: 'ghcr.io/your-org/risewithin/content-service:1.0.0'
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4007
          envFrom:
            - configMapRef:
                name: platform-config
          env:
            - name: MONGO_URL
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: CONTENT_MONGO_URL
            - name: MONGO_DB
              value: content
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 8
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
